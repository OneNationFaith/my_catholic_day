name: my_catholic_day
description: "A Catholic daily prayer and companion app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  shared_preferences: ^2.5.5

  http: ^1.5.0

  intl: ^0.20.2

  url_launcher: ^6.3.2

  connectivity_plus: ^7.0.0

  # SQLite for Android, iOS, and macOS.
  sqflite: ^2.4.3

  # SQLite support for Windows and Linux.
  sqflite_common_ffi: ^2.4.2

  # Finds the correct private data folder on each device.
  path_provider: ^2.1.6

  # Builds safe Windows, Android, and iOS file paths.
  path: ^1.9.1
  sqlite3: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/databases/webc.db
    - assets/databases/dra.db
    - assets/data/lectionary/
    - assets/data/liturgical_calendar/
    - assets/images/onf_logo.png

